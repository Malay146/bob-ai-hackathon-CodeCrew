submission:
  title: "WaferLens"

  problem_statement: >
    At advanced semiconductor fab nodes (3nm/5nm), a 1% yield drop costs tens
    of millions of dollars per month. Process engineers spend weeks manually
    cross-referencing thousands of equipment sensor readings and process
    parameters per lot to find the root cause of a yield excursion, and have
    no way to know a batch is at risk until after it has already run.

  solution_summary: >
    WaferLens analyses wafer lot sensor data to rank the equipment sensors
    most correlated with failure fab-wide, explains exactly how a given lot
    deviates from the healthy baseline on those sensors with a ranked,
    probability-scored root cause and recommended corrective action, and
    flags upcoming batches whose process parameters resemble historical
    low-yield lots before they run. The same analysis is exposed to an IBM
    Bob agent as MCP tools, so an engineer can ask "why did lot 42 fail?" in
    chat and get the identical, explainable answer the dashboard shows.

  key_features:
    - "Fab-wide root cause ranking via correlation analysis (no ML, fully explainable)"
    - "Per-lot ranked root causes with deviation severity and recommended corrective actions"
    - "Upcoming batch risk scoring (0-100) with a retrospective accuracy check against real outcomes"
    - "IBM Bob integration via MCP server exposing 6 tools backed by the same analysis engine"
    - "Interactive Check-a-Batch tool: paste raw sensor readings, get an instant risk score and findings"

  tech_stack:
    languages: ["TypeScript"]
    frameworks: ["Next.js", "React", "Prisma"]
    ibm_technologies: ["IBM Bob (MCP)", "watsonx.ai"]
    databases: ["PostgreSQL"]
    other: ["shadcn/ui", "Tailwind CSS", "Recharts"]

  what_we_are_most_proud_of: >
    The root cause and risk-prediction engine is built entirely from plain,
    explainable statistics (point-biserial correlation, z-score deviation)
    rather than a trained model — every ranked cause and every risk score can
    be traced back to a specific sensor's correlation and this lot's exact
    deviation from the healthy baseline. That same engine is genuinely
    load-bearing for IBM Bob: the MCP server calls the identical functions
    the dashboard uses, so Bob's answers and the dashboard's numbers can
    never drift apart.

  known_limitations: >
    Defect-pattern analysis from wafer defect maps/images (scratches,
    edge-rings, donuts, etc.) was not implemented. The dataset used here
    (UCI SECOM) contains only anonymized sensor/process-parameter readings
    and pass/fail outcomes, no defect imagery or defect-type labels, so
    visual defect-pattern classification would require a different dataset
    (e.g. WM-811K wafer maps) and an actual image-classification model,
    which was out of scope given the team's stack and timeline. Separately,
    the exact IBM Bob CLI/config format was not available to us during
    development; the MCP server is built and tested against the standard
    Model Context Protocol SDK and is ready to wire up once that spec is
    available. There is also no authentication in this build — it's a
    single-engineer demo tool, not multi-tenant.

